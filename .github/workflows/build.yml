name: Build exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name Phantom --icon icon.ico --add-data "icon.ico;." --hidden-import pystray._win32 --collect-all customtkinter phantom.py
      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/Phantom.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Phantom.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Phantom
          path: |
            dist/Phantom.exe
            dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/Phantom.exe
            dist/SHA256SUMS.txt
